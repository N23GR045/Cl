name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Playwright (solo para las pruebas)
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          PUBLIC_SITE_URL: https://www.raizverde.example

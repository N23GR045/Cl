# Despliegue en Netlify (ver docs/DESPLIEGUE.md)
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # PUBLIC_SITE_URL y STRIPE_SECRET_KEY se definen en Site settings → Environment variables

# Cabeceras de seguridad para todas las páginas.
# El hash de script-src corresponde al script en línea del tema (src/layouts/Base.astro).
# Si cambias ese script, ejecuta `npm test`: te dirá el hash nuevo.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-TlkpcbkM8qbi2TfYPylHq/Nk9PZYfJdy9tNpIxh8SD8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Archivos con huella en el nombre: caché de un año
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

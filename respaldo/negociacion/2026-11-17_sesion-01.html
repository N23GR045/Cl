<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Negociación · Sesión 1 — Mentalidad y voz</title>
<meta name="description" content="Sesión 1 del entrenamiento de negociación: la emoción decide, empatía táctica y los tres tonos de voz, con simulador de compra de coche de segunda mano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F0D; --bg2:#111714; --card:#151C18; --line:#24302A; --line2:#2F3D35;
  --tx:#E9F1EC; --tx2:#A9B8AF; --tx3:#7A8A81;
  --ac:#3DDC97; --ac2:#2BB57A; --acs:rgba(61,220,151,.12);
  --bad:#FF7A6B; --bads:rgba(255,122,107,.12); --mid:#F5C451; --mids:rgba(245,196,81,.12);
  --r:18px; --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0F0D;--tx:#E9F1EC}}
:root[data-theme="dark"]{--bg:#0B0F0D;--tx:#E9F1EC}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px}
h1,h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.01em;line-height:1.05}
h2{font-size:clamp(28px,7vw,38px);margin-bottom:14px}
h3{font-size:15px;font-weight:600;letter-spacing:.02em}
p{color:var(--tx2)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:600}
section{padding:44px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* HERO */
.hero{position:relative;padding:56px 0 28px;isolation:isolate}
.hero h1{font-size:clamp(46px,13vw,84px);margin:12px 0 14px}
.hero h1 em{color:var(--ac);font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{font-size:12.5px;border:1px solid var(--line2);border-radius:99px;padding:5px 11px;color:var(--tx2);background:var(--bg2)}
.pill b{color:var(--tx);font-weight:600}
.nobig{position:absolute;right:-10px;top:18px;z-index:-1;font-family:"Instrument Serif",serif;font-size:min(60vw,360px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(61,220,151,.22);user-select:none;pointer-events:none}
.nobig span{display:inline-block;animation:breathe 6s var(--ease) infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.key{display:grid;gap:10px;margin-top:8px}
.key li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.key li .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:13px}
.key li p{color:var(--tx)}

/* compare */
.cmp{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.cmp{grid-template-columns:1fr 1fr}}
.ex{border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.ex.bad{background:linear-gradient(180deg,var(--bads),transparent 70%)}
.ex.good{background:linear-gradient(180deg,var(--acs),transparent 70%);border-color:rgba(61,220,151,.35)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 8px;margin-bottom:10px}
.bad .tag{background:var(--bads);color:var(--bad)}
.good .tag{background:var(--acs);color:var(--ac)}
.bubble{background:var(--bg2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;margin:6px 0;color:var(--tx);font-size:15px}
.bubble.me{border-radius:14px 14px 4px 14px;background:#17241D;margin-left:18px}
.ex small{display:block;color:var(--tx3);margin-top:8px;font-size:13.5px}

/* frases */
.phr{display:grid;gap:8px}
.phr button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--tx);font-size:15.5px;transition:border-color .2s,transform .2s var(--ease),background .2s}
.phr button:hover{border-color:var(--line2)}
.phr button:active{transform:scale(.985)}
.phr button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.phr button .u{font-size:12px;color:var(--tx3);flex:none}
.phr button.ok{border-color:var(--ac);background:#132019}
.phr button.ok .u{color:var(--ac)}

/* SIM */
.sim{background:var(--bg2);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.simhead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3DDC97,#1E7A54);display:grid;place-items:center;font-weight:700;color:#06110B}
.simhead .who b{display:block;font-size:15px}
.simhead .who span{font-size:12.5px;color:var(--tx3)}
.prog{margin-left:auto;font-size:12.5px;color:var(--tx2);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .5s var(--ease)}
.counters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ctr{text-align:center;padding:6px 2px;border-radius:10px;background:var(--card)}
.ctr b{display:block;font-size:18px;font-variant-numeric:tabular-nums;transition:color .3s}
.ctr span{font-size:10.5px;color:var(--tx3);letter-spacing:.02em}
.ctr.pop b{color:var(--ac);animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.chat{padding:14px 12px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;animation:in .42s var(--ease) both}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:#1A3226;border:1px solid rgba(61,220,151,.3);border-bottom-right-radius:5px}
.why{align-self:stretch;font-size:13.5px;padding:10px 12px;border-radius:12px;border-left:3px solid;animation:in .42s .08s var(--ease) both}
.why.g{background:var(--acs);border-color:var(--ac);color:#CFF5E3}
.why.m{background:var(--mids);border-color:var(--mid);color:#F7E6B7}
.why.b{background:var(--bads);border-color:var(--bad);color:#FFD3CD}
.why b{font-weight:600}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.opts{display:grid;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--card)}
.opts .lbl{font-size:12px;color:var(--tx3);padding:0 2px}
.opt{all:unset;cursor:pointer;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);color:var(--tx);font-size:15px;line-height:1.4;transition:border-color .2s,background .2s,transform .2s var(--ease);animation:in .35s var(--ease) both}
.opt:nth-child(3){animation-delay:.05s}.opt:nth-child(4){animation-delay:.1s}
.opt:hover{border-color:var(--ac)}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.end{padding:20px 16px;text-align:center}
.score{font-family:"Instrument Serif",serif;font-size:76px;line-height:1;color:var(--ac)}
.score small{font-size:28px;color:var(--tx3)}
.end p{margin:8px auto 14px;max-width:46ch}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:99px;background:var(--ac);color:#06110B;font-weight:600;font-size:15px;transition:transform .2s var(--ease),background .2s}
.btn:hover{background:#5BE6A9}.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.best{font-size:12.5px;color:var(--tx3);margin-top:10px}

.reto{border:1px solid rgba(61,220,151,.4);background:radial-gradient(120% 120% at 100% 0%,rgba(61,220,151,.16),transparent 60%),var(--card)}
.reto .q{color:var(--tx);font-size:17px;margin:10px 0}
.list{display:grid;gap:8px;margin-top:6px}
.list li{list-style:none;padding-left:22px;position:relative;color:var(--tx2)}
.list li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.grid2{display:grid;gap:12px}
@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.studio{font-size:13.5px;color:var(--tx3);border-top:1px dashed var(--line2);padding-top:14px;margin-top:18px}
.src a{color:var(--ac);text-decoration:none;border-bottom:1px solid rgba(61,220,151,.35)}
.src li{font-size:13.5px}
.note{font-size:13px;color:var(--tx3);margin-top:10px}

.rv{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.on{opacity:1;transform:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:var(--ac);color:#06110B;font-weight:600;font-size:14px;padding:10px 16px;border-radius:99px;transition:all .3s var(--ease);pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>

<script>
var C = {"n": 1, "title": "Negociación · Sesión 1 — Mentalidad y voz", "desc": "Sesión 1 del entrenamiento de negociación: la emoción decide, empatía táctica y los tres tonos de voz, con simulador de compra de coche de segunda mano.", "big": "voz", "eyebrow": "Entrenamiento Negociación · Semana 1 · Por qué la emoción decide", "h1": "Sesión 1<br>Mentalidad <em>y voz</em>", "lead": "Antes de cualquier técnica: la gente decide con la emoción y luego lo justifica. Tu primera herramienta no es un argumento, es cómo suenas.", "pills": [["Caso", "coche de segunda mano"], ["Reto", "llamar a tu compañía para que no te suban la cuota"], ["Tiempo", "15 min"]], "key": ["Negociar no es ganar una discusión: es conseguir que el otro se sienta entendido para que quiera trabajar contigo.", "Empatía táctica = entender lo que siente y teme el otro, sin tener que darle la razón.", "Tu voz cambia su estado de ánimo antes que tus palabras: cálida casi siempre, grave y lenta para lo que no se mueve, nunca de choque."], "tech": {"h": "Los tres tonos", "ctx": "Vas a ver un coche que se vende por 9.500 € (caso inventado) y sabes que necesita gastos pronto.", "extra": "<p style='color:var(--tx)'><b style='color:var(--ac)'>Cálido y tranquilo</b> (sonriendo, aunque sea por teléfono): el tono por defecto; relaja y hace que te hablen más.<br><b style='color:var(--ac)'>Grave, lento y seguro</b> («locutor nocturno»): para lo que no es negociable. Baja el tono al final de la frase.<br><b style='color:var(--bad)'>Asertivo y rápido</b>: suena a ataque. Úsalo casi nunca.</p>", "bad": {"msgs": [[1, "<i>[rápido, tenso]</i> 9.500 es una pasada. ¿Me lo dejas en 8.000 o qué?"], [0, "Pues no, y si no te interesa, hay más gente."]], "why": "Suena a pelea. Él defiende su precio y su orgullo en vez de escucharte."}, "good": {"msgs": [[1, "<i>[cálido, despacio]</i> Se nota que lo has cuidado. Con lo que le toca de mantenimiento, el precio me queda alto. ¿Cómo lo ves tú?"], [0, "Bueno… lo de la distribución es verdad. Vamos a hablarlo."]], "why": "Reconoces lo bueno, dices lo que no encaja sin acusar y le dejas responder."}, "note": "La voz se entrena: graba en el móvil la frase «para mí eso no es viable» en los dos tonos y escucha la diferencia."}, "frases": [["Antes de hablar de nada, ¿me cuentas un poco su historia?", "cálido"], ["Gracias por decírmelo tú, se agradece.", "cálido"], ["Para mí, eso no es viable.", "locutor"], ["Me encantaría poder hacerlo; ahora mismo no puedo.", "locutor"], ["Quiero que esto te salga bien a ti también.", "cálido"], ["Vamos a verlo con calma.", "cálido"], ["Déjame pensarlo un momento.", "pausa"], ["¿Cómo lo ves tú?", "calibrada"]], "sim": {"h": "Javier vende su coche", "intro": "Caso ficticio de práctica: un particular vende un compacto diésel de 2017 por 9.500 €. Cada respuesta indica también el tono con el que la dices.", "av": "J", "who": "Javier · vendedor particular", "style": "Estilo complaciente · quiere caer bien", "note": "Antes de comprar un coche usado de verdad: pide el informe del vehículo de la DGT y firma un contrato de compraventa (lo revisamos con la skill abogado-espana si quieres)."}, "ctr": [["cal", "tono cálido"], ["loc", "tono locutor"], ["esp", "espejos"], ["eti", "etiquetas"], ["calib", "calibradas"]], "turns": [{"them": "¡Hola! ¿Vienes por el coche? Ya te aviso: 9.500 € y no lo bajo, que me han llamado varios.", "o": [{"t": "[cálido, sonriendo] Hola, Javier, gracias por enseñármelo. Antes de hablar de nada, ¿me cuentas un poco su historia?", "p": 2, "r": "Claro, hombre. Lo compré nuevo y siempre ha ido al taller oficial…", "w": "g", "x": "<b>Tono cálido + curiosidad.</b> No peleas el precio antes de tiempo y él empieza a darte información.", "k": ["cal"]}, {"t": "[firme, rápido] 9.500 es mucho. Yo vengo con 8.000.", "p": 0, "r": "Pues nos ahorramos tiempo, ¿no?", "w": "b", "x": "<b>Tono de choque y cifra prematura.</b> Pones a la defensiva a alguien que en el fondo quiere caer bien.", "k": []}, {"t": "[nervioso] Ah… vale, vale. ¿Se puede ver?", "p": 0.5, "r": "Sí, mira, pero el precio es ese, ¿eh?", "w": "m", "x": "<b>Voz insegura.</b> Le dice que vas a aceptar lo que te diga.", "k": []}]}, {"them": "Lo compré nuevo, siempre en el oficial. Lo vendo porque hemos tenido el segundo crío y necesitamos algo más grande.", "o": [{"t": "¿Algo más grande?", "p": 2, "r": "Sí, ya tengo visto un monovolumen. Lo recojo el día 10, así que quiero dejar esto cerrado esta semana.", "w": "g", "x": "<b>Espejo.</b> Repites sus palabras y callas: te revela que tiene prisa (plazo del día 10).", "k": ["esp"]}, {"t": "Enhorabuena. Bueno, ¿y el precio?", "p": 0.5, "r": "9.500, ya te lo he dicho.", "w": "m", "x": "<b>Felicitas pero cortas.</b> Vuelves a la cifra sin aprovechar lo que te estaba contando.", "k": []}, {"t": "Ya, todos dicen lo del taller oficial.", "p": 0, "r": "Pues tengo el libro sellado, si quieres verlo.", "w": "b", "x": "<b>Desconfianza en voz alta.</b> Le ofende y se pone a defender el coche.", "k": []}]}, {"them": "…lo recojo el día 10 y no quiero tener dos coches pagando seguro.", "o": [{"t": "Parece que tienes mucho entre manos y lo que más te importa es venderlo rápido y sin líos.", "p": 2, "r": "Eso, sin líos. Que me han venido dos a marearme y no han vuelto.", "w": "g", "x": "<b>Etiqueta.</b> Nombras lo que siente. Se relaja y te ve como alguien distinto a los que le marearon.", "k": ["eti"]}, {"t": "Pues si tienes prisa, bájalo.", "p": 0, "r": "Prisa sí, regalarlo no.", "w": "b", "x": "<b>Usas su prisa contra él.</b> Lo nota y se cierra.", "k": []}, {"t": "Yo creo que te va a costar venderlo.", "p": 0, "r": "Ya veremos. Hay mucho interesado.", "w": "b", "x": "<b>«Yo creo que tú…»</b> es una opinión que le invita a llevarte la contraria.", "k": []}]}, {"them": "Mira, ahí tienes el libro. Lo único: las ruedas están algo gastadas y la ITV vence en enero.", "o": [{"t": "[cálido] Gracias por decírmelo tú, se agradece la sinceridad. ¿Qué crees que le tocará en los próximos meses?", "p": 2, "r": "Pues ruedas, y la distribución, que va por kilómetros y le toca pronto.", "w": "g", "x": "<b>Tono cálido + pregunta calibrada.</b> Premias su honestidad y él mismo te da más motivos para ajustar el precio.", "k": ["cal", "calib"]}, {"t": "¡Ruedas e ITV! Eso son un montón de euros.", "p": 0.5, "r": "Bueno, tampoco exageres.", "w": "m", "x": "<b>Tienes razón, pero el tono lo convierte en reproche.</b>", "k": []}, {"t": "Vale.", "p": 0, "r": "Pues eso, está perfecto para el uso normal.", "w": "b", "x": "<b>Dejas pasar información clave</b> sin explorar.", "k": []}]}, {"them": "La distribución… sí, toca a los 120.000 y lleva 112.000.", "o": [{"t": "[grave, lento] Entiendo que el coche está cuidado. Con ruedas, ITV y distribución por delante, para mí 9.500 no es viable.", "p": 2, "r": "Ya… ¿y cuánto pensabas?", "w": "g", "x": "<b>Voz de locutor.</b> Firme sin agresividad. Él pasa de defender a preguntar.", "k": ["loc"]}, {"t": "[agudo, acelerado] ¡Pues entonces me tienes que bajar 2.000 como mínimo!", "p": 0, "r": "Eh, tranquilo. Así no.", "w": "b", "x": "<b>Tono de ataque.</b> Misma información, peor resultado.", "k": []}, {"t": "[dudando] Bueno, tampoco pasa nada, ya lo haré yo…", "p": 0, "r": "Claro, son cosas normales del coche.", "w": "b", "x": "<b>Regalas tu mejor argumento.</b>", "k": []}]}, {"them": "¿Y cuánto pensabas?", "o": [{"t": "[cálido] Igual piensas que voy a hacerte una oferta ridícula, y entiendo que lo has cuidado. ¿Cómo lo ves si lo calculamos con lo que cuesta lo que le toca?", "p": 2, "r": "Bueno, vamos a verlo… Con todo eso, ¿8.600 y lo dejamos cerrado?", "w": "g", "x": "<b>Te adelantas a lo que piensa y preguntas «¿cómo?».</b> Él mismo propone una cifra más baja.", "k": ["cal", "calib"]}, {"t": "8.000 y me lo llevo ahora.", "p": 1, "r": "8.000 no. 9.000.", "w": "m", "x": "<b>Ancla clara</b>, pero sin preparar: él contraataca y partís la diferencia.", "k": []}, {"t": "Lo que tú digas.", "p": 0, "r": "Pues 9.300, por el detalle.", "w": "b", "x": "<b>Cedes el control del todo.</b>", "k": []}]}, {"them": "8.600, transferencia y te lo llevas el sábado.", "o": [{"t": "[grave] Me encaja. ¿Cómo lo hacemos con el contrato y el cambio de titular para que los dos estemos tranquilos?", "p": 2, "r": "En una gestoría, a medias. Trato hecho.", "w": "g", "x": "<b>Cierre firme + «¿cómo?».</b> El acuerdo queda atado y sin riesgos.", "k": ["loc", "calib"]}, {"t": "Hecho, te hago un Bizum ahora para reservarlo.", "p": 0.5, "r": "Vale, perfecto.", "w": "m", "x": "<b>Pagar sin contrato ni informe del vehículo</b> es un riesgo innecesario.", "k": []}, {"t": "¿Y 8.300?", "p": 0.5, "r": "Oye, ya te he bajado 900 €…", "w": "m", "x": "<b>Apretar tras un buen acuerdo</b> estropea la relación que has creado.", "k": []}]}], "end": ["Nivel negociador: has escuchado, has nombrado lo que sentía y has cerrado con un «cómo».", "Buen camino. Repite y prueba a escuchar más antes de hablar de cifras.", "Has ido al choque o a la cifra demasiado pronto. Vuelve a intentarlo con más calma."], "reto": {"h": "Tu compañía te sube la cuota", "q": "Te llega un aviso: tu tarifa de fibra y móvil sube el mes que viene. Llamas al departamento de bajas.", "ask": "Escribe aquí <b>las dos primeras frases</b> que dirías e indica <b>con qué tono</b> dirías cada una (cálido o locutor). Yo haré de agente 2–3 rondas y te pondré nota.", "hint": "Pista: abre en cálido (la persona al teléfono no tiene la culpa) y guarda la voz de locutor para tu límite."}, "apr": ["La emoción decide primero; los argumentos llegan después.", "Empatía táctica no es estar de acuerdo: es demostrar que entiendes.", "Tono cálido por defecto; grave y lento solo para lo que no se mueve."], "mej": ["Es la primera sesión: aún no hay notas anteriores que aplicar.", "Practica la voz de locutor en voz alta: grábate y escúchate.", "Escucha más de lo que hablas: la prisa de Javier solo salió porque preguntaste."], "estudio": "lidera Contenido (técnica, tonos y caso del coche) con Crec
